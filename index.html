<script>
   const menuBtn = document.getElementById('menuBtn');
   const mobileMenu = document.getElementById('mobileMenu');
   menuBtn.addEventListener('click', () => {
      const is0pen = !mobileMenu.classList.contains('hidden');
      mobileMenu.classList.toggle('hidden', is0pen);
      mobileMenu.classList.toggle('flex', !is0pen);
      menuBtn.setAttribute('aria-expanded', String(!is0pen));
      menuBtn.setAttribute('aria-label', is0pen ? 'Buka menu' : 'Tutup menu');
   });
</script>
